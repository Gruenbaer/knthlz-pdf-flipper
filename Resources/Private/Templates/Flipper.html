<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:asset.css identifier="pdf-flipper" href="EXT:pdf_flipper/Resources/Public/Css/flipper.css" />
    <f:asset.script identifier="pdf-flipper" type="module" src="EXT:pdf_flipper/Resources/Public/JavaScript/flipper.js" />
    <div class="pdf-flipper" data-pdf-flipper="{flipper.options}">
        <f:if condition="flipper.error"><p role="alert">{flipper.error}</p></f:if>
        <f:if condition="flipper.pdf"><p class="pdf-flipper-fallback"><a href="{flipper.pdf}">Vollständige PDF öffnen</a></p></f:if>
    </div>
    <f:if condition="flipper.caption"><p class="pdf-flipper-caption">{flipper.caption}</p></f:if>
</f:section>
</html>
